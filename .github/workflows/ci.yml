name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s plugins/memory-sync/tests -t plugins/memory-sync -v
      - name: Session routing tests
        run: node --test plugins/memory-sync/tests/test_routing.mjs
      - name: Package builds and the CLI starts
        run: uv tool run --from ./plugins/memory-sync memory-store --version
      - name: Manifests are valid JSON
        run: uv run --no-project python -c "import json,pathlib; [json.loads(pathlib.Path(p).read_text()) for p in ('.github/plugin/marketplace.json','plugins/memory-sync/plugin.json','plugins/memory-sync/mcp.json','plugins/memory-sync/com.github.copilot/hooks/hooks.json')]"
